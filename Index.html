<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Prompt',sans-serif;background:#fff5f8;color:#3a2a2e}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.c{aspect-ratio:2/3.2;border-radius:18px;background:#fff;border:1px solid #f8d7e0;cursor:pointer;position:relative;overflow:hidden;transition:.2s;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.c:hover{transform:translateY(-4px)}
.back{background:radial-gradient(circle at 50% 30%,#ffe6ee,#f7b8c9 60%,#e8a0b0);display:flex;flex-direction:column;align-items:center;justify-content:center}
.back .h{font-size:42px}.back .n{margin-top:6px;letter-spacing:3px;font-size:13px;opacity:.7}
.front{padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.front .num{font-size:11px;letter-spacing:2px;opacity:.5}.front .th{font-weight:500;margin-top:4px;line-height:1.2}.front .en{font-size:10px;opacity:.5;margin-top:2px}
.reading{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;min-height:120px;padding:20px;background:#fff;border-radius:24px;border:1px dashed #f2c2cf;margin:24px 0}
.btn{border:0;border-radius:999px;padding:11px 20px;cursor:pointer;font-family:'Prompt';font-size:14px}
.btn-dark{background:#1a1a1a;color:#fff}.btn-pink{background:#ff6b8a;color:#fff}.btn-line{background:#fff;border:1px solid #f1c0cc}
.flip{perspective:1000px}.flip-inner{width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d;position:relative}
.flip.flipped .flip-inner{transform:rotateY(180deg)}.face{backface-visibility:hidden;position:absolute;inset:0;border-radius:18px;overflow:hidden}.face.front2{transform:rotateY(180deg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.modal.show{display:flex}.box{background:#fff;border-radius:24px;padding:22px;max-width:520px;width:100%}
</style>
</head>
<body>

<div id="modal" class="modal" onclick="closeM()"><div class="box" onclick="event.stopPropagation()"><div id="mContent"></div><button class="btn btn-line" style="margin-top:14px;width:100%" onclick="closeM()">ปิด</button></div></div>

{number:7,name_th:"การเยียวยาใจ",name_en:"HEART HEALING",mean:"อนุญาตให้ตัวเองเจ็บ แล้วความเจ็บจะสอนวิธีเยียวยา"},

{number:24,name_th:"การให้อภัย",name_en:"FORGIVENESS",mean:"การให้อภัยคือการปลดโซ่ตัวเองออกจากอดีต"},

{number:26,name_th:"ความไว้ใจอันลึกซึ้ง",name_en:"DEEP TRUST",mean:"เมื่อไว้ใจลึกซึ้ง ความกลัวจะละลาย"},

{number:28,name_th:"พลังงานศักดิ์สิทธิ์",name_en:"DIVINE ENERGY",mean:"คุณกำลังถูกโอบอุ้มด้วยพลังงานที่สูงกว่าตัวคุณ"},
{number:29,name_th:"ความสมดุล",name_en:"BALANCE",mean:"รักที่ดีคือสมดุลระหว่างให้และรับ"},
{number:30,name_th:"การโอบกอดตัวเอง",name_en:"SELF EMBRACE",mean:"โอบกอดตัวเองในวันที่ไม่มีใครเข้าใจ"},
{number:31,name_th:"แสงนำทาง",name_en:"GUIDING LIGHT",mean:"หัวใจของคุณรู้ทางเสมอ"},
{number:32,name_th:"ความกล้าหาญ",name_en:"COURAGE",mean:"กล้าที่จะซื่อสัตย์กับความรู้สึกตัวเอง"},
{number:33,name_th:"จักรวาลแห่งรัก",name_en:"UNIVERSE OF LOVE",mean:"จักรวาลกำลังจัดเรียงบางอย่างเพื่อคุณ"},
{number:34,name_th:"การคืนดี",name_en:"RECONCILIATION",mean:"การคืนดีที่แท้จริงเริ่มจากการคืนดีกับตัวเอง"},
{number:35,name_th:"พรหมลิขิต",name_en:"SOULMATE",mean:"บางคนไม่ได้มาเพื่ออยู่ตลอดไป แต่มาเพื่อเปลี่ยนตลอดไป"},
{number:36,name_th:"การเติบโต",name_en:"GROWTH",mean:"ความรักที่เติบโตคือรักที่ยอมให้อีกฝ่ายเติบโตด้วย"},
{number:37,name_th:"ความเงียบศักดิ์สิทธิ์",name_en:"SACRED SILENCE",mean:"ในความเงียบ คุณจะได้ยินเสียงหัวใจชัดที่สุด"},
{number:38,name_th:"ปาฏิหาริย์แห่งรัก",name_en:"MIRACLE",mean:"ปาฏิหาริย์เกิดเมื่อคุณเชื่อว่ารักเป็นไปได้"},
{number:39,name_th:"การปลดปล่อย",name_en:"RELEASE",mean:"ปลดปล่อยความคาดหวัง แล้วรักจะเบาสบาย"},
{number:40,name_th:"ความเมตตา",name_en:"COMPASSION",mean:"เมตตาต่อคนที่ทำร้ายคุณ คือการปลดปล่อยตัวเอง"},
{number:41,name_th:"สัญญาแห่งหัวใจ",name_en:"HEART PROMISE",mean:"คำสัญญาที่สำคัญที่สุดคือสัญญาที่ให้ไว้กับหัวใจตัวเอง"},
{number:42,name_th:"ทางเลือกใหม่",name_en:"NEW PATH",mean:"เมื่อประตูหนึ่งปิด จักรวาลกำลังเปิดอีกบานที่สว่างกว่า"},
{number:43,name_th:"พลังแห่งการอธิษฐาน",name_en:"PRAYER POWER",mean:"คำอธิษฐานจากหัวใจบริสุทธิ์มีพลังมากกว่าที่คุณคิด"},
{number:44,name_th:"ความจริงใจ",name_en:"SINCERITY",mean:"ความจริงใจคือภาษาที่ทุกคนเข้าใจ"},
{number:45,name_th:"การเยียวยาอดีต",name_en:"PAST HEALING",mean:"อดีตไม่ได้ตามหลอกหลอน มันแค่รอการเยียวยา"},
{number:46,name_th:"ความหวัง",name_en:"HOPE",mean:"ความหวังคือแสงเล็กๆ ที่ทำให้หัวใจไม่มืดสนิท"},
{number:47,name_th:"การรวมเป็นหนึ่ง",name_en:"UNION",mean:"เมื่อสองหัวใจรวมเป็นหนึ่ง ไม่ใช่การสูญเสียตัวตน แต่คือการขยายตัวตน"},
{number:48,name_th:"ความอิสระ",name_en:"FREEDOM",mean:"รักที่แท้จริงให้อิสระ ไม่ได้กักขัง"},
{number:49,name_th:"ของขวัญจากจักรวาล",name_en:"GIFT FROM UNIVERSE",mean:"สิ่งที่คุณรอคอยกำลังถูกห่อเป็นของขวัญส่งมา"},
{number:50,name_th:"ความศรัทธา",name_en:"FAITH",mean:"ศรัทธาในรัก แม้ในวันที่รักยังมองไม่เห็น"},
{number:51,name_th:"การเฉลิมฉลอง",name_en:"CELEBRATION",mean:"เฉลิมฉลองความรักในทุกรูปแบบ"},
{number:52,name_th:"นิรันดร์แห่งรัก",name_en:"ETERNAL LOVE",mean:"รักแท้ไม่เคยจบ มันแค่เปลี่ยนรูปแบบ"},

// หลังไพ่ 99 - ใช้ถาวร ไม่สับรวม
const BACK = {number:99,name_th:"หลังไพ่",name_en:"CARD BACK"};

let order = [...CARDS];
function backHTML(){return `<div class="c back"><div class="h">♥</div><div style="font-size:22px;margin-top:4px">99</div><div class="n">HEALING HEART</div></div>`}
function frontHTML(c){return `<div class="c front"><div><div class="num">${String(c.number).padStart(2,'0')}</div><div class="th">${c.name_th}</div><div class="en">${c.name_en}</div></div><div style="font-size:11px;opacity:.7;line-height:1.4">${c.mean}</div></div>`}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const list=order.filter(c=>!q||c.name_th.includes(q)||c.name_en.toLowerCase().includes(q));
  document.getElementById('cnt').textContent=list.length;
  document.getElementById('deck').innerHTML=list.map(c=>`<div onclick="openMCard(${c.number})">${backHTML()}<div style="text-align:center;font-size:11px;margin-top:4px">${String(c.number).padStart(2,'0')} ${c.name_th}</div></div>`).join('');
}
function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render()}
function draw(n){
  shuffle();
  const picked=order.slice(0,n);
  const labels=n===3?['อดีต','ปัจจุบัน','อนาคต']:n===5?['คุณ','เขา','อุปสรรค','คำแนะนำ','บทสรุป']:['คำตอบ'];
  document.getElementById('reading').innerHTML=picked.map((c,i)=>`
    <div style="width:150px;text-align:center">
      <div style="font-size:11px;color:#ff6b8a;margin-bottom:6px">${labels[i]||''}</div>
      <div class="flip" onclick="this.classList.toggle('flipped')" style="width:100%;aspect-ratio:2/3.2">
        <div class="flip-inner"><div class="face">${backHTML()}</div><div class="face front2">${frontHTML(c)}</div></div>
      </div>
      <div style="font-size:12px;margin-top:6px">${String(c.number).padStart(2,'0')} ${c.name_th}</div>
    </div>
  `).join('');
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearR(){document.getElementById('reading').innerHTML='<span style="opacity:.4;margin:auto">ยังไม่ได้เปิดไพ่ — กดปุ่มด้านบน</span>'}
function openMCard(num){
  const c=CARDS.find(x=>x.number===num);
  document.getElementById('mContent').innerHTML=`<div style="display:flex;gap:14px"><div style="width:110px">${backHTML()}</div><div><div style="font-size:11px;opacity:.5">${String(c.number).padStart(2,'0')} • ${c.name_en}</div><div style="font-size:18px;font-weight:500;margin-top:4px">${c.name_th}</div><div style="margin-top:10px;font-size:13px;line-height:1.6">${c.mean}</div></div></div><div style="margin-top:14px;background:#fff5f8;padding:12px;border-radius:14px;font-size:12px">Affirmation: ฉันอนุญาตให้หัวใจได้รับการเยียวยาในแบบที่อ่อนโยนที่สุด</div>`;
  document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show')}
